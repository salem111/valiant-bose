<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soul Radiance Glow -->
    <radialGradient id="soulGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <!-- Crimson Ruby Heart Gradient -->
    <linearGradient id="rubyHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="25%" stop-color="#fb7185"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Ethereal Angel Wings Gradient -->
    <linearGradient id="etherealWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fbcfe8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Golden Aura Outline -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="soulShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f43f5e" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#fff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Soul Aura -->
  <circle cx="256" cy="256" r="230" fill="url(#soulGlow)" />

  <!-- Left Ethereal Wing -->
  <path d="M220 270 C160 210, 80 160, 40 80 C80 130, 110 200, 120 280 C80 230, 60 190, 45 160 C75 220, 110 290, 140 330 C100 290, 80 260, 65 240 C95 290, 140 350, 180 370 Z"
        fill="url(#etherealWing)" opacity="0.9" filter="url(#soulShadow)" />

  <!-- Right Ethereal Wing -->
  <path d="M292 270 C352 210, 432 160, 472 80 C432 130, 402 200, 392 280 C432 230, 452 190, 467 160 C437 220, 402 290, 372 330 C412 290, 432 260, 447 240 C417 290, 372 350, 332 370 Z"
        fill="url(#etherealWing)" opacity="0.9" filter="url(#soulShadow)" />

  <!-- Outer Golden Halo Ring -->
  <ellipse cx="256" cy="265" rx="145" ry="135" fill="none" stroke="url(#goldLight)" stroke-width="4" opacity="0.75" filter="url(#soulShadow)" />

  <!-- Back Secondary Soul Heart (Violet) -->
  <path d="M225 385 C215 375, 100 275, 95 185 C90 100, 185 75, 225 150 C265 75, 360 100, 355 185 C350 275, 235 375, 225 385 Z"
        fill="#7c3aed" opacity="0.5" transform="scale(0.88) translate(40, 20)" />

  <!-- Main Radiant Soul Heart (Ruby Crimson) -->
  <path d="M256 420 C244 410, 106 298, 98 194 C90 96, 192 68, 256 152 C320 68, 422 96, 414 194 C406 298, 268 410, 256 420 Z"
        fill="url(#rubyHeart)" filter="url(#soulShadow)" />

  <!-- Diamond Crystal Facet (Top Left Sheen) -->
  <path d="M140 160 C130 120, 180 90, 230 120 C245 130, 252 145, 250 160 C235 150, 185 140, 150 180 Z"
        fill="#ffffff" opacity="0.75" />

  <!-- Center Soul Dove / Flame Emblem -->
  <g transform="translate(256, 255) scale(1.1)">
    <!-- Soul Spark Core -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#soulShadow)" />
    <circle cx="0" cy="0" r="18" fill="#fef08a" />
    <circle cx="0" cy="0" r="10" fill="#f43f5e" />
  </g>

  <!-- Gleaming Magic Stars ✨ -->
  <g transform="translate(256, 95) scale(0.85)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#ffffff" filter="url(#soulShadow)" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
  </g>

  <g transform="translate(110, 180) scale(0.65)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#ffffff" />
  </g>

  <g transform="translate(402, 180) scale(0.65)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#ffffff" />
  </g>

  <g transform="translate(360, 340) scale(0.55)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#fef08a" />
  </g>
</svg>
